# Production stack: PostgreSQL + API + Nginx reverse proxy.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      AUTH_REQUIRED: "true"
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      API_KEYS: ${API_KEYS:-}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      STORAGE_DIR: /data/storage
    volumes:
      - app_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  app_storage:
