# Local development / demo stack (SQLite, auth optional, docs enabled).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: development
      DEBUG: "true"
      AUTH_REQUIRED: "false"
      CORS_ORIGINS: http://localhost:8000
      STORAGE_DIR: /data/storage
    volumes:
      - demo_storage:/data/storage
    restart: unless-stopped

volumes:
  demo_storage:
